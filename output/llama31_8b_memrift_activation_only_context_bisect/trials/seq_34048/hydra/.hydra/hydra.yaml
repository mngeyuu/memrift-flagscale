hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - action=run
    - experiment.exp_dir=/home/secure/myc/memrift-flagscale/output/llama31_8b_memrift_activation_only_context_bisect/trials/seq_34048
    - experiment.exp_name=llama31_8b_memrift_act_only_ctx_34048
    - train.system.memrift_enable=true
    - train.system.memrift_weight_enable=false
    - train.system.memrift_activation_enable=true
    - train.system.memrift_act_async=true
    - train.model.transformer_impl=transformer_engine
    - train.model.tokenizer_path=/home/secure/myc/model/llama-3.1-8b
    - train.model.tokenizer_model=/home/secure/myc/model/llama-3.1-8b
    - train.model.seq_length=34048
    - train.model.max_position_embeddings=131072
    - train.data.micro_batch_size=1
    - train.data.global_batch_size=1
    - train.trainer.train_iters=1
    - train.trainer.lr_warmup_iters=0
    - +train.trainer.eval_iters=0
    - +train.trainer.eval_interval=1000000000
    - +train.system.num_workers=0
    - train.system.logging.log_interval=1
  job:
    name: run
    chdir: null
    override_dirname: +train.system.num_workers=0,+train.trainer.eval_interval=1000000000,+train.trainer.eval_iters=0,action=run,experiment.exp_dir=/home/secure/myc/memrift-flagscale/output/llama31_8b_memrift_activation_only_context_bisect/trials/seq_34048,experiment.exp_name=llama31_8b_memrift_act_only_ctx_34048,train.data.global_batch_size=1,train.data.micro_batch_size=1,train.model.max_position_embeddings=131072,train.model.seq_length=34048,train.model.tokenizer_model=/home/secure/myc/model/llama-3.1-8b,train.model.tokenizer_path=/home/secure/myc/model/llama-3.1-8b,train.model.transformer_impl=transformer_engine,train.system.logging.log_interval=1,train.system.memrift_act_async=true,train.system.memrift_activation_enable=true,train.system.memrift_enable=true,train.system.memrift_weight_enable=false,train.trainer.lr_warmup_iters=0,train.trainer.train_iters=1
    id: ???
    num: ???
    config_name: train_llama31_8b_mock
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/secure/myc/memrift-flagscale
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/secure/myc/memrift-flagscale/examples/memrift/conf
      schema: file
      provider: main
    - path: ''
      schema: msc
      provider: msc-universal
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/secure/myc/memrift-flagscale/output/llama31_8b_memrift_activation_only_context_bisect/trials/seq_34048/hydra
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
