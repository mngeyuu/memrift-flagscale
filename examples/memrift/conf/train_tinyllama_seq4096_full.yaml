# MemRift 训练入口：TinyLlama 1.1B, seq=4096, bs=1, 权重+激活压缩均开启

defaults:
  - train/tinyllama_1b_seq4096_bs1_memrift_full

experiment:
  exp_name: memrift_tinyllama_seq4096_bs1
  exp_dir: ./outputs/${experiment.exp_name}
  task:
    type: train
    backend: megatron
    entrypoint: flagscale/train/train_gpt.py
  runner:
    type: torchrun
    nnodes: 1
    nproc_per_node: 1

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
