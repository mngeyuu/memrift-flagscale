# MemRift Mistral-7B inference entry (run via run.py)
#
# Usage (from repo root):
#   export TORCH_DEVICE_BACKEND_AUTOLOAD=0
#   python run.py \
#     --config-path=examples/memrift/conf \
#     --config-name=generate_mistral_7b \
#     action=run \
#     train.system.memrift_compressed_weight_dir=./memrift_weights/mistral_7b_level18 \
#     train.model.tokenizer_path=/path/to/Mistral-7B-Instruct-v0.2 \
#     train.model.tokenizer_model=/path/to/Mistral-7B-Instruct-v0.2 \
#     'train.model.prompt=Once upon a time' \
#     train.model.max_new_tokens=50

defaults:
  - generate/mistral_7b_memrift

experiment:
  envs:
    TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
  cmds:
    before_start: export TORCH_DEVICE_BACKEND_AUTOLOAD=0
  exp_name: memrift_generate_mistral_7b
  exp_dir: ./outputs/${experiment.exp_name}
  task:
    type: train
    backend: megatron
    entrypoint: flagscale/train/generate_gpt.py
  runner:
    type: torchrun
    nnodes: 1
    nproc_per_node: 1

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
