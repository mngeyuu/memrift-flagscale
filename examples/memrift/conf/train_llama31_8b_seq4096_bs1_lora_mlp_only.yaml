# Pure LoRA MLP-only baseline: Llama-3.1-8B, seq=4096, bs=1, mock, MemRift off

defaults:
  - train/llama31_8b_seq4096_bs1_lora_mlp_only

experiment:
  exp_name: llama31_8b_seq4096_bs1_lora_mlp_only
  exp_dir: ./outputs/${experiment.exp_name}
  envs:
    TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
  task:
    type: train
    backend: megatron
    entrypoint: flagscale/train/train_gpt.py
  runner:
    type: torchrun
    nnodes: 1
    nproc_per_node: 1

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
