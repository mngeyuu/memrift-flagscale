# 纯 LoRA 基线：TinyLlama 1.1B, seq=4096, bs=1, mock（无 MemRift）

defaults:
  - train/tinyllama_1b_lora_only_seq4096_bs1

experiment:
  exp_name: tinyllama_seq4096_bs1_lora_only
  exp_dir: ./outputs/${experiment.exp_name}
  envs:
    TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
  task:
    type: train
    backend: megatron
    entrypoint: flagscale/train/train_gpt.py
  runner:
    type: torchrun
    nnodes: 1
    nproc_per_node: 1

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
