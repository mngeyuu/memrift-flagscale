# MemRift Example Training Configuration
# This is the main Hydra configuration file for MemRift training examples

defaults:
  - train/tinyllama_1b_lora_memrift

experiment:
  exp_name: memrift_example
  exp_dir: ./outputs/${experiment.exp_name}
  task:
    type: train
    backend: megatron
    entrypoint: flagscale/train/train_gpt.py
  runner:
    type: torchrun
    nnodes: 1
    nproc_per_node: 1

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
