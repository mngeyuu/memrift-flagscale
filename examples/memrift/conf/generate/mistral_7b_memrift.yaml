# Mistral-7B MemRift Inference Configuration
#
# Runs generate_gpt.py with layer-by-layer weight streaming:
#   - Frozen weights decompressed one layer at a time (CPU → GPU)
#   - GPU peak ≈ 1 layer (~400 MB) rather than full model (~14 GB)
#   - No LoRA/PEFT required for pure base-model inference
#
# IMPORTANT: MemRift v1 only supports TP=1
#
# Prerequisites:
# 1. Build CUDA extension:
#    cd flagscale/compress/float_split_stride_pin && pip install -e .
#
# 2. Prepare compressed weights (if not already done):
#    python -m flagscale.compress.memrift.offline_comp.prepare_weight \
#        --model /path/to/Mistral-7B-Instruct-v0.2 \
#        --outdir ./memrift_weights/mistral_7b_level18 --level 18

system:
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  context_parallel_size: 1

  disable_bias_linear: true
  use_flash_attn: true
  sequence_parallel: false
  use_distributed_optimizer: false

  precision:
    fp16: false
    bf16: true

  logging:
    log_interval: 1
    wandb_mode: disabled

  # No checkpoint saving during inference
  checkpoint:
    save_interval: 100000

  # Run in foreground so generated text is visible in the terminal
  run_foreground: true

  # ── MemRift: weight streaming for inference ──
  memrift_enable: true
  memrift_weight_enable: true
  memrift_compressed_weight_dir: ./memrift_weights/mistral_7b_level18
  memrift_zstd_level: 3
  memrift_prefetch_layers: 1
  memrift_weight_async: true
  memrift_decode_pool_workers: 16
  memrift_print_debug: false
  # Activation compression is training-only; disable for inference
  memrift_activation_enable: false

model:
  # Mistral-7B architecture
  num_layers: 32
  hidden_size: 4096
  ffn_hidden_size: 14336
  num_attention_heads: 32
  num_query_groups: 8
  seq_length: 2048
  max_position_embeddings: 131072

  tokenizer_type: HuggingFaceTokenizer
  tokenizer_path: /share/project/mengyc/models/Mistral-7B-Instruct-v0.2
  tokenizer_model: /share/project/mengyc/models/Mistral-7B-Instruct-v0.2
  make_vocab_size_divisible_by: 64

  norm_init_weight: 1.0
  use_rotary_position_embeddings: true
  rotary_base: 1000000
  no_position_embedding: true
  normalization: RMSNorm
  norm_epsilon: 1e-5
  swiglu: true
  untie_embeddings_and_output_weights: true
  attention_dropout: 0.0
  hidden_dropout: 0.0
  init_method_std: 0.02

  transformer_impl: transformer_engine

  # ── Generation parameters ──
  prompt: "Once upon a time"
  max_new_tokens: 50
  greedy: true

# Minimal data section required by the Megatron runner arg-flattener.
# generate_gpt.py sets mock_data=True by default; no real data is read.
data:
  micro_batch_size: 1
  global_batch_size: 1
