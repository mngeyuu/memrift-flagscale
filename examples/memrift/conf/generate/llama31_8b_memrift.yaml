# Llama-3.1-8B MemRift Inference Configuration
#
# Runs generate_gpt.py with layer-by-layer weight streaming.
# GPU peak ≈ 1 layer (~400 MB) rather than full model (~16 GB).
#
# IMPORTANT: MemRift v1 only supports TP=1
#
# Prerequisites:
# 1. Build CUDA extension:
#    cd flagscale/compress/float_split_stride_pin && pip install -e .
#
# 2. Compressed weights (pre-built):
#    ./memrift_weights/llama31_8b_level18  (already present in the repo)

system:
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  context_parallel_size: 1

  disable_bias_linear: true
  use_flash_attn: true
  sequence_parallel: false
  use_distributed_optimizer: false

  precision:
    fp16: false
    bf16: true

  logging:
    log_interval: 1
    wandb_mode: disabled

  checkpoint:
    save_interval: 100000

  run_foreground: true

  # ── MemRift: weight streaming for inference ──
  memrift_enable: true
  memrift_weight_enable: true
  memrift_compressed_weight_dir: ./memrift_weights/llama31_8b_level18
  memrift_zstd_level: 3
  memrift_prefetch_layers: 1
  memrift_weight_async: true
  memrift_decode_pool_workers: 16
  memrift_print_debug: false
  memrift_activation_enable: false

model:
  # Llama-3.1-8B architecture
  num_layers: 32
  hidden_size: 4096
  ffn_hidden_size: 14336
  num_attention_heads: 32
  num_query_groups: 8
  seq_length: 2048
  max_position_embeddings: 131072

  tokenizer_type: HuggingFaceTokenizer
  tokenizer_path: meta-llama/Llama-3.1-8B
  tokenizer_model: meta-llama/Llama-3.1-8B
  make_vocab_size_divisible_by: 64

  norm_init_weight: 1.0
  use_rotary_position_embeddings: true
  rotary_base: 500000
  no_position_embedding: true
  normalization: RMSNorm
  norm_epsilon: 1e-5
  swiglu: true
  untie_embeddings_and_output_weights: true
  attention_dropout: 0.0
  hidden_dropout: 0.0
  init_method_std: 0.02

  transformer_impl: transformer_engine

  # ── Generation parameters ──
  prompt: "Once upon a time"
  max_new_tokens: 50
  greedy: true

data:
  micro_batch_size: 1
  global_batch_size: 1
