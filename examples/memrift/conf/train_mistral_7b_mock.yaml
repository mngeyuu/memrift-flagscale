# Mistral-7B MemRift mock training entry

defaults:
  - train/mistral_7b_lora_memrift_mock

experiment:
  exp_name: memrift_mistral_7b
  exp_dir: ./outputs/${experiment.exp_name}
  task:
    type: train
    backend: megatron
    entrypoint: flagscale/train/train_gpt.py
  runner:
    type: torchrun
    nnodes: 1
    nproc_per_node: 1

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
