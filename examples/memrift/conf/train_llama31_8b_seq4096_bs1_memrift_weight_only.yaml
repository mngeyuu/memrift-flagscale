# Llama-3.1-8B 仅权重压缩入口配置
# - 仅开启权重压缩，关闭激活压缩，用于性能对比

defaults:
  - train/llama31_8b_seq4096_bs1_memrift_weight_only

experiment:
  exp_name: llama31_8b_seq4096_bs1_memrift_weight_only
  exp_dir: ./outputs/${experiment.exp_name}
  envs:
    TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
    MEMRIFT_DEEP_ASYNC: "1"
    MEMRIFT_WEIGHT_RELAX_SYNC: "1"
    MEMRIFT_ALLOW_CPU_WEIGHT_ZSTD: "1"
    MEMRIFT_ITER_LOG: "1"
    MEMRIFT_ITER_LOG_ITERS: "5"
    MEMRIFT_MAT_DBG19: "1"
  task:
    type: train
    backend: megatron
    entrypoint: flagscale/train/train_gpt.py
  runner:
    type: torchrun
    nnodes: 1
    nproc_per_node: 1

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
