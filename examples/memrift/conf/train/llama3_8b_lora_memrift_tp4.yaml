# LLaMA-3-8B LoRA + MemRift — TP=4 (4 GPUs)
# Weight dir must be compressed with:
#   python flagscale/compress/memrift/offline_comp/prepare_weight_tp2.py \
#       --model-dir /path/to/Meta-Llama-3-8B-Instruct \
#       --outdir ./memrift_weights/llama3_8b_tp4_level3 \
#       --tp-size 4 --level 3

system:
  tensor_model_parallel_size: 4
  pipeline_model_parallel_size: 1
  context_parallel_size: 1

  disable_bias_linear: true
  use_flash_attn: true
  sequence_parallel: true
  use_distributed_optimizer: true

  precision:
    fp16: false
    bf16: true

  logging:
    log_interval: 1
    tensorboard_log_interval: 10
    wandb_mode: disabled

  checkpoint:
    save_interval: 500
  ckpt_format: torch

  memrift_enable: true
  memrift_weight_enable: true
  memrift_compressed_weight_dir: ./memrift_weights/llama3_8b_tp4_level3
  memrift_zstd_level: 3
  memrift_prefetch_layers: 12
  memrift_weight_async: true
  memrift_activation_enable: true
  memrift_act_async: true
  memrift_decode_pool_workers: 48
  memrift_compress_pool_workers: 8
  memrift_print_debug: false

model:
  num_layers: 32
  hidden_size: 4096
  ffn_hidden_size: 14336
  num_attention_heads: 32
  num_query_groups: 8
  seq_length: 2048
  max_position_embeddings: 131072

  tokenizer_type: HuggingFaceTokenizer
  tokenizer_path: /share/project/mengyc/models/Meta-Llama-3-8B-Instruct
  tokenizer_model: /share/project/mengyc/models/Meta-Llama-3-8B-Instruct
  make_vocab_size_divisible_by: 64

  norm_init_weight: 1.0
  use_rotary_position_embeddings: true
  rotary_base: 500000
  no_position_embedding: true
  normalization: RMSNorm
  norm_epsilon: 1e-5
  swiglu: true
  untie_embeddings_and_output_weights: true

  attention_dropout: 0.0
  hidden_dropout: 0.0
  init_method_std: 0.02

  transformer_impl: transformer_engine

  peft_type: lora
  lora_target_modules:
    - linear_qkv
    - linear_proj
    - linear_fc1
    - linear_fc2
  lora_dim: 16
  lora_alpha: 32
  lora_dropout: 0.0

data:
  data_path: /path/to/data
  split: 949,50,1
  micro_batch_size: 1
  global_batch_size: 8

trainer:
  train_iters: 1000
  lr: 2e-4
  min_lr: 2e-5
  lr_warmup_iters: 100
  lr_decay_style: cosine
  weight_decay: 0.1
  clip_grad: 1.0
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1e-8
