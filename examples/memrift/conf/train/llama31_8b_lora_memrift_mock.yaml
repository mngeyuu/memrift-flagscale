# Llama-3.1-8B + MemRift metric defaults.
# Metrics override this file to use Alpaca, single GPU, and async weight+activation
# compression. Kept under the historical *_mock config name for compatibility with
# scripts/metrics/llama8b/model_env.sh.

defaults:
  - llama31_8b_lora_memrift
  - _self_

system:
  run_foreground: false

data:
  data_path: /share/project/mengyc/data/alpaca_megatron/alpaca_text_document
  mock_data: false
  split: 1,0,0
  micro_batch_size: 1
  global_batch_size: 1

trainer:
  train_iters: 5
  eval_iters: 0
  lr_warmup_iters: 0
