# Llama-3.1-8B LoRA + MemRift Training Configuration
#
# Demonstrates MemRift memory-efficient training on a large model:
# - Frozen base weights loaded from compressed format
# - LoRA adapters for fine-tuning
# - On-demand weight materialization to save GPU memory
#
# IMPORTANT: MemRift v1 only supports TP=1 (tensor_model_parallel_size: 1)
#
# Prerequisites:
# 1. Build CUDA extension:
#    cd flagscale/compress/float_split_stride_pin
#    pip install -e .
#
# 2. Prepare compressed weights:
#    python -m flagscale.compress.memrift.offline_comp.prepare_weight \
#        --model meta-llama/Llama-3.1-8B \
#        --outdir ./memrift_weights/llama31_8b_level18 \
#        --level 18
#
# 3. Update paths below

system:
  # ============================================
  # CRITICAL: TP=1 constraint for MemRift v1
  # ============================================
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  context_parallel_size: 1

  disable_bias_linear: true
  use_flash_attn: true
  sequence_parallel: false
  # LoRA+MemRift: keep false to avoid DistributedOptimizer gradient buffering overhead / VRAM
  use_distributed_optimizer: false

  precision:
    fp16: false
    bf16: true

  logging:
    log_interval: 10
    tensorboard_log_interval: 10
    wandb_mode: disabled

  checkpoint:
    save_interval: 500
  ckpt_format: torch

  # ============================================
  # MemRift Configuration
  # ============================================
  memrift_enable: true
  memrift_weight_enable: true
  memrift_compressed_weight_dir: ./memrift_weights/llama31_8b_level18
  memrift_zstd_level: 3
  memrift_prefetch_layers: 12
  memrift_weight_async: true
  memrift_activation_enable: true
  memrift_act_async: true
  memrift_decode_pool_workers: 48
  memrift_compress_pool_workers: 8
  memrift_print_debug: false

model:
  # Llama-3.1-8B architecture
  num_layers: 32
  hidden_size: 4096
  ffn_hidden_size: 14336
  num_attention_heads: 32
  num_query_groups: 8
  seq_length: 2048
  max_position_embeddings: 131072

  tokenizer_type: HuggingFaceTokenizer
  tokenizer_path: meta-llama/Llama-3.1-8B
  tokenizer_model: meta-llama/Llama-3.1-8B
  make_vocab_size_divisible_by: 64

  norm_init_weight: 1.0
  use_rotary_position_embeddings: true
  rotary_base: 500000
  no_position_embedding: true
  normalization: RMSNorm
  norm_epsilon: 1e-5
  swiglu: true
  untie_embeddings_and_output_weights: true
  attention_dropout: 0.0
  hidden_dropout: 0.0
  init_method_std: 0.02

  transformer_impl: transformer_engine

  # ============================================
  # PEFT/LoRA Configuration
  # ============================================
  peft_type: lora
  lora_target_modules:
    - linear_qkv
    - linear_proj
    - linear_fc1
    - linear_fc2
  lora_dim: 16
  lora_alpha: 32
  lora_dropout: 0.0

data:
  data_path: /path/to/data
  split: 949,50,1
  micro_batch_size: 1
  global_batch_size: 8

trainer:
  train_iters: 1000
  lr: 2e-4
  min_lr: 2e-5
  lr_warmup_iters: 100
  lr_decay_style: cosine
  weight_decay: 0.1
  clip_grad: 1.0
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1e-8
