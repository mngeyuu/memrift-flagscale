# TinyLlama 1.1B + MemRift 使用 openassistant-guanaco 训练
# data_path 设为 HuggingFace 数据集名，训练启动时自动拉取并转为 IndexedDataset

defaults:
  - tinyllama_1b_lora_memrift

data:
  data_path: timdettmers/openassistant-guanaco
  mock_data: false
  split: 949,50,1
  micro_batch_size: 1
  global_batch_size: 8

trainer:
  train_iters: 1000
  lr_warmup_iters: 100
