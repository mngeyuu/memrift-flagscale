# TinyLlama 1.1B 纯 LoRA（整模 HF 加载，无 MemRift）
# seq=4096, bs=1, mock 数据；与 MemRift 实验对齐便于对比迭代时间

defaults:
  - tinyllama_1b_lora_memrift

model:
  seq_length: 4096
  max_position_embeddings: 4096

data:
  data_path: null
  mock_data: true
  split: 1,0,0
  micro_batch_size: 1
  global_batch_size: 1

system:
  run_foreground: true
  memrift_enable: false
  memrift_weight_enable: false
  memrift_activation_enable: false
  memrift_act_async: false
  memrift_profile_memory: false
  logging:
    log_interval: 1

trainer:
  train_iters: 20
  lr_warmup_iters: 2
