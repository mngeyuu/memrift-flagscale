# MemRift 训练入口：使用 mock 数据（无需 data_path）
# 用于 TinyLlama 1.1B 一键训练脚本

defaults:
  - train/tinyllama_1b_lora_memrift_mock

experiment:
  exp_name: memrift_example
  exp_dir: ./outputs/${experiment.exp_name}
  task:
    type: train
    backend: megatron
    entrypoint: flagscale/train/train_gpt.py
  runner:
    type: torchrun
    nnodes: 1
    nproc_per_node: 1

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
