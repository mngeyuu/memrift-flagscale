# MemRift Llama-3.1-8B inference entry (run via run.py)
#
# Usage (from repo root):
#   export TORCH_DEVICE_BACKEND_AUTOLOAD=0
#   python run.py \
#     --config-path=examples/memrift/conf \
#     --config-name=generate_llama31_8b \
#     action=run \
#     train.model.tokenizer_path=meta-llama/Llama-3.1-8B \
#     train.model.tokenizer_model=meta-llama/Llama-3.1-8B \
#     'train.model.prompt=Once upon a time' \
#     train.model.max_new_tokens=50

defaults:
  - generate/llama31_8b_memrift

experiment:
  envs:
    TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
  cmds:
    before_start: export TORCH_DEVICE_BACKEND_AUTOLOAD=0
  exp_name: memrift_generate_llama31_8b
  exp_dir: ./outputs/${experiment.exp_name}
  task:
    type: train
    backend: megatron
    entrypoint: flagscale/train/generate_gpt.py
  runner:
    type: torchrun
    nnodes: 1
    nproc_per_node: 1

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
