# MemRift 训练入口：LoRA MLP-only + mock 数据（用于显存对比）
# 可通过 override train.system.memrift_enable=true/false 对比纯 LoRA 与 MemRift+LoRA

defaults:
  - train/tinyllama_1b_lora_mlp_only_mock

experiment:
  exp_name: memrift_example
  exp_dir: ./outputs/${experiment.exp_name}
  task:
    type: train
    backend: megatron
    entrypoint: flagscale/train/train_gpt.py
  runner:
    type: torchrun
    nnodes: 1
    nproc_per_node: 1

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
