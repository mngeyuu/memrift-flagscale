hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - action=run
    - experiment.exp_dir=outputs/end2end_copy_local_gems/run
    - experiment.exp_name=llama31_8b_memrift_copy_local_gems
    - +experiment.envs.CUDA_VISIBLE_DEVICES=0
    - +experiment.envs.GEMS_VENDOR=metax
    - +experiment.envs.MEMRIFT_ACT_SPLIT_PATH=copy
    - +experiment.envs.MEMRIFT_ACT_SPLIT_PROFILE=1
    - train.system.memrift_enable=true
    - train.system.memrift_weight_enable=true
    - train.system.memrift_activation_enable=true
    - train.system.memrift_weight_async=true
    - train.system.memrift_act_async=true
    - train.system.memrift_compressed_weight_dir=/MXC550/share/myc/memrift-flagscale/memrift_weights/llama31_8b_zstd_level18
    - train.model.tokenizer_path=/MXC550/share/myc/model/llama-3.1-8b
    - train.model.tokenizer_model=/MXC550/share/myc/model/llama-3.1-8b
    - train.model.transformer_impl=local
    - train.trainer.train_iters=1
    - train.trainer.lr_warmup_iters=0
    - train.system.logging.log_interval=1
  job:
    name: run
    chdir: null
    override_dirname: +experiment.envs.CUDA_VISIBLE_DEVICES=0,+experiment.envs.GEMS_VENDOR=metax,+experiment.envs.MEMRIFT_ACT_SPLIT_PATH=copy,+experiment.envs.MEMRIFT_ACT_SPLIT_PROFILE=1,action=run,experiment.exp_dir=outputs/end2end_copy_local_gems/run,experiment.exp_name=llama31_8b_memrift_copy_local_gems,train.model.tokenizer_model=/MXC550/share/myc/model/llama-3.1-8b,train.model.tokenizer_path=/MXC550/share/myc/model/llama-3.1-8b,train.model.transformer_impl=local,train.system.logging.log_interval=1,train.system.memrift_act_async=true,train.system.memrift_activation_enable=true,train.system.memrift_compressed_weight_dir=/MXC550/share/myc/memrift-flagscale/memrift_weights/llama31_8b_zstd_level18,train.system.memrift_enable=true,train.system.memrift_weight_async=true,train.system.memrift_weight_enable=true,train.trainer.lr_warmup_iters=0,train.trainer.train_iters=1
    id: ???
    num: ???
    config_name: train_llama31_8b_mock
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /root/.config/superpowers/worktrees/memrift-flagscale/memrift-split-copy-benchmark
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /root/.config/superpowers/worktrees/memrift-flagscale/memrift-split-copy-benchmark/examples/memrift/conf
      schema: file
      provider: main
    - path: ''
      schema: msc
      provider: msc-universal
    - path: ''
      schema: structured
      provider: schema
    output_dir: /root/.config/superpowers/worktrees/memrift-flagscale/memrift-split-copy-benchmark/outputs/end2end_copy_local_gems/run/hydra
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
