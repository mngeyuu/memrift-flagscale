- action=run
- experiment.exp_dir=outputs/end2end_copy_local_gems_v2/run
- experiment.exp_name=llama31_8b_memrift_copy_local_gems_v2
- +experiment.envs.CUDA_VISIBLE_DEVICES=0
- +experiment.envs.GEMS_VENDOR=metax
- +experiment.envs.MEMRIFT_ACT_SPLIT_PATH=copy
- +experiment.envs.MEMRIFT_ACT_SPLIT_PROFILE=1
- train.system.memrift_enable=true
- train.system.memrift_weight_enable=true
- train.system.memrift_activation_enable=true
- train.system.memrift_weight_async=true
- train.system.memrift_act_async=true
- train.system.memrift_compressed_weight_dir=/MXC550/share/myc/memrift-flagscale/memrift_weights/llama31_8b_zstd_level18
- train.model.tokenizer_path=/MXC550/share/myc/model/llama-3.1-8b
- train.model.tokenizer_model=/MXC550/share/myc/model/llama-3.1-8b
- train.model.transformer_impl=local
- +train.model.no_persist_layer_norm=true
- +train.model.no_rope_fusion=true
- train.trainer.train_iters=1
- train.trainer.lr_warmup_iters=0
- train.system.logging.log_interval=1
